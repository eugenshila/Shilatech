name: Migrate Supabase database

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/locations-pos.sql'
      - 'scripts/migrate-locations-pos.mjs'
      - 'lib/account-security.mjs'
      - '.github/workflows/migrate-supabase.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Shilatech database migration
        run: |
          set +e
          pnpm db:migrate > migrate-output.txt 2>&1
          status=$?
          echo '## Migration output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 migrate-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat migrate-output.txt
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 30 migrate-output.txt | tr '\n' ' | ' | tr -d '\r')
            echo "::error::Migration failed: ${msg}"
          fi
          exit $status

      - name: Verify stock reconciliation script is available
        run: pnpm db:check-stock
