name: Migrate Supabase database

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_MIGRATION_DATABASE_URL }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Shilatech database migration
        run: pnpm db:migrate

      - name: Verify stock reconciliation script is available
        run: pnpm db:check-stock
