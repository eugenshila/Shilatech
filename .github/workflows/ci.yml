name: Shilatech CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "scrum/**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/shilatech_ci
          JWT_SECRET: shilatech-ci-only-secret-not-for-production-123456
